add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: www.google-analytics.com; font-src 'self' data:; connect-src 'self' cloudflareinsights.com www.google-analytics.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' static.cloudflareinsights.com www.googletagmanager.com; form-action 'self'; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'none';" always;
add_header Cross-Origin-Embedder-Policy "unsafe-none";
add_header Cross-Origin-Opener-Policy "unsafe-none";
add_header Cross-Origin-Resource-Policy "cross-origin";