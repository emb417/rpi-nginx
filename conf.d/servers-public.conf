# my.effinmoney.com — app + API
server {
    listen 443 ssl;
    server_name my.effinmoney.com;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/effinmoney.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/effinmoney.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;

    include conf.d/includes/security-headers-base.conf;
    include conf.d/includes/security-headers-app.conf;
    include conf.d/includes/waf-block.conf;
    include conf.d/includes/upstream-vars.conf;
    include conf.d/includes/proxy-common.conf;

    proxy_cookie_flags ~ HttpOnly Secure SameSite=Lax;

    include conf.d/includes/routes-effinmoney-web.conf;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; form-action 'self'; frame-src 'none'; frame-ancestors 'self'; object-src 'none'; base-uri 'none';" always;
}

# Main domain (metaforiq.com)
server {
    listen 443 ssl default_server;
    server_name metaforiq.com www.metaforiq.com;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/metaforiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaforiq.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    
    server_tokens off;

    include conf.d/includes/security-headers-base.conf;
    include conf.d/includes/security-headers-www.conf;
    include conf.d/includes/waf-block.conf;
    include conf.d/includes/upstream-vars.conf;
    include conf.d/includes/proxy-common.conf;

    proxy_cookie_flags ~ HttpOnly Secure SameSite=Strict;

    include conf.d/includes/routes-metaforiq.conf;
}
