# HTTP to HTTPS redirect for all domains
server {
    listen 80;
    server_name metaforiq.com www.metaforiq.com
                pihole.metaforiq.com
                kuma.metaforiq.com
                mistandlore.com www.mistandlore.com
                effinmoney.com www.effinmoney.com my.effinmoney.com;
    
    return 301 https://$host$request_uri;
}

# Map subdomains to upstream services
map $host $backend {
    pihole.metaforiq.com        $rpi_pihole;
    kuma.metaforiq.com          $rpi_kuma;
    mistandlore.metaforiq.com   $rpi_mistandlore;
}

server {
    listen 443 ssl;
    server_name kuma.metaforiq.com;

    ssl_certificate /etc/letsencrypt/live/metaforiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaforiq.com/privkey.pem;

    include conf.d/includes/security-headers-base.conf;
    include conf.d/includes/security-headers-app.conf;
    include conf.d/includes/waf-block.conf;
    include conf.d/includes/upstream-vars.conf;
    include conf.d/includes/proxy-common.conf;

    location / {
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval'";
}

# Pihole SSL server for subdomain
server {
    listen 443 ssl;
    server_name pihole.metaforiq.com;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/metaforiq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metaforiq.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    include conf.d/includes/security-headers-base.conf;
    include conf.d/includes/security-headers-www.conf;
    include conf.d/includes/waf-block.conf;
    include conf.d/includes/upstream-vars.conf;
    include conf.d/includes/proxy-common.conf;
    
    location = / {
        return 301 /admin/;
    }
    
    location / {
        proxy_pass $backend;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Content-Security-Policy;
    }
}

server {
    listen 443 ssl;
    server_name mistandlore.com www.mistandlore.com;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/mistandlore.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mistandlore.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    
    server_tokens off;

    include conf.d/includes/security-headers-base.conf;
    include conf.d/includes/security-headers-www.conf;
    include conf.d/includes/waf-block.conf;
    include conf.d/includes/upstream-vars.conf;
    include conf.d/includes/proxy-common.conf;

    proxy_cookie_flags ~ HttpOnly Secure SameSite=Strict;

    include conf.d/includes/routes-mistandlore.conf;
}

